name: Build Images and Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：输入新版本号（如 v0.0.2）自动打 Tag 并发版；留空则仅刷新 latest / slim 镜像"
        required: false
        default: ""
        type: string
      no_cache:
        description: "跳过构建缓存以拉取上游最新版的 HiFox / CC-Switch / Node.js"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.variant }} - ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - full
          - slim
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build context
        id: prep
        run: |
          repo_lc="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          with_gui="true"
          if [ "${{ matrix.variant }}" = "slim" ]; then
            with_gui="false"
          fi
          cachebust="1"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.no_cache }}" = "true" ]; then
            cachebust="$(date +%s)"
          fi
          echo "ghcr_image=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "with_cc_switch=${with_gui}" >> "$GITHUB_OUTPUT"
          echo "cachebust=${cachebust}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.ghcr_image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_CC_SWITCH=${{ steps.prep.outputs.with_cc_switch }}
            CACHEBUST=${{ steps.prep.outputs.cachebust }}
          outputs: type=image,name=${{ steps.prep.outputs.ghcr_image }},push=true,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          printf '%s' "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/${{ matrix.variant }}-${{ matrix.platform.arch }}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Multi-Arch Images & Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME || 'waset' }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and image names
        id: info
        run: |
          repo_lc="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          repo_name="${repo_lc#*/}"
          ghcr_image="ghcr.io/${repo_lc}"
          dh_image="${DOCKERHUB_USER}/${repo_name}"
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            raw_tag="${{ inputs.release_tag }}"
            case "${raw_tag}" in
              v*) tag="${raw_tag}" ;;
              *) tag="v${raw_tag}" ;;
            esac
            if ! git rev-parse "${tag}" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${tag}" -m "chore(release): 发布 ${tag}"
              git push origin "${tag}"
            fi
          fi
          echo "ghcr_image=${ghcr_image}" >> "$GITHUB_OUTPUT"
          echo "dh_image=${dh_image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "clean_ver=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Primary)
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch manifests to Docker Hub & GHCR
        id: manifests
        run: |
          set -euo pipefail
          GHCR_IMAGE="${{ steps.info.outputs.ghcr_image }}"
          DH_IMAGE="${{ steps.info.outputs.dh_image }}"
          TAG="${{ steps.info.outputs.tag }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          FULL_AMD64="$(cat "${{ runner.temp }}/digests/full-amd64")"
          FULL_ARM64="$(cat "${{ runner.temp }}/digests/full-arm64")"
          SLIM_AMD64="$(cat "${{ runner.temp }}/digests/slim-amd64")"
          SLIM_ARM64="$(cat "${{ runner.temp }}/digests/slim-arm64")"

          FULL_TAGS=("-t" "${GHCR_IMAGE}:latest")
          SLIM_TAGS=("-t" "${GHCR_IMAGE}:slim")

          if [ -n "${TAG}" ]; then
            CLEAN_VER="${TAG#v}"
            FULL_TAGS+=("-t" "${GHCR_IMAGE}:${TAG}" "-t" "${GHCR_IMAGE}:${CLEAN_VER}")
            SLIM_TAGS+=("-t" "${GHCR_IMAGE}:${TAG}-slim" "-t" "${GHCR_IMAGE}:${CLEAN_VER}-slim")
          fi

          if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            FULL_TAGS+=("-t" "${DH_IMAGE}:latest")
            SLIM_TAGS+=("-t" "${DH_IMAGE}:slim")
            if [ -n "${TAG}" ]; then
              CLEAN_VER="${TAG#v}"
              FULL_TAGS+=("-t" "${DH_IMAGE}:${TAG}" "-t" "${DH_IMAGE}:${CLEAN_VER}")
              SLIM_TAGS+=("-t" "${DH_IMAGE}:${TAG}-slim" "-t" "${DH_IMAGE}:${CLEAN_VER}-slim")
            fi
          fi

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${REPO_URL}" \
            --annotation "index:org.opencontainers.image.description=HiFox 容器化节点公共环境（含官方 CC-Switch Web GUI）" \
            "${FULL_TAGS[@]}" \
            "${GHCR_IMAGE}@${FULL_AMD64}" \
            "${GHCR_IMAGE}@${FULL_ARM64}"

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${REPO_URL}" \
            --annotation "index:org.opencontainers.image.description=HiFox 容器化节点公共环境（精简无头版）" \
            "${SLIM_TAGS[@]}" \
            "${GHCR_IMAGE}@${SLIM_AMD64}" \
            "${GHCR_IMAGE}@${SLIM_ARM64}"

          echo "full_amd64=${FULL_AMD64}" >> "$GITHUB_OUTPUT"

      - name: Sync README description to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.info.outputs.dh_image }}
          readme-filepath: ./README.md

      - name: Extract built-in component versions
        id: versions
        run: |
          set -euo pipefail
          GHCR_IMAGE="${{ steps.info.outputs.ghcr_image }}"
          FULL_JSON="$(docker run --rm --entrypoint cat "${GHCR_IMAGE}@${{ steps.manifests.outputs.full_amd64 }}" /etc/hifox-versions.json)"
          echo "hifox=$(printf '%s' "${FULL_JSON}" | jq -r '.hifox')" >> "$GITHUB_OUTPUT"
          echo "cc_switch=$(printf '%s' "${FULL_JSON}" | jq -r '.cc_switch')" >> "$GITHUB_OUTPUT"
          echo "node=$(printf '%s' "${FULL_JSON}" | jq -r '.node')" >> "$GITHUB_OUTPUT"
          echo "npm=$(printf '%s' "${FULL_JSON}" | jq -r '.npm')" >> "$GITHUB_OUTPUT"
          echo "gh=$(printf '%s' "${FULL_JSON}" | jq -r '.gh')" >> "$GITHUB_OUTPUT"

      - name: Compile changelog via Release Drafter
        id: drafter
        if: ${{ steps.info.outputs.tag != '' }}
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          version: ${{ steps.info.outputs.clean_ver }}
          tag: ${{ steps.info.outputs.tag }}
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize and publish GitHub Release
        if: ${{ steps.info.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFTER_BODY: ${{ steps.drafter.outputs.body }}
          DRAFTER_ID: ${{ steps.drafter.outputs.id }}
        run: |
          set -euo pipefail
          TAG="${{ steps.info.outputs.tag }}"
          DH_IMAGE="${{ steps.info.outputs.dh_image }}"
          GHCR_IMAGE="${{ steps.info.outputs.ghcr_image }}"

          mkdir -p dist
          sed "s|waset/hifox-docker:latest|${DH_IMAGE}:${TAG}|g" docker-compose.yml > dist/docker-compose.yml
          sed "s|waset/hifox-docker:latest|${DH_IMAGE}:${TAG}|g" .env.example > dist/.env.example

          CHANGELOG_SECTION="${DRAFTER_BODY}"
          if printf '%s' "${CHANGELOG_SECTION}" | grep -q '\* No changes'; then
            PREV_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+' | grep -Fxv "${TAG}" | head -n 1 || true)"
            RANGE="${PREV_TAG:+${PREV_TAG}..}${TAG}"
            FALLBACK_COMMITS="$(git log "${RANGE}" --no-merges --pretty=format:'- %s (`%h`)')"
            CHANGELOG_SECTION="$(printf "## 🚀 更新内容\n\n%s\n\n**完整变更记录**: https://github.com/%s/compare/%s...%s" \
              "${FALLBACK_COMMITS}" "${{ github.repository }}" "${PREV_TAG:-v0.0.1}" "${TAG}")"
          fi

          {
            printf '%s\n\n' "${CHANGELOG_SECTION}"
            printf '## 📦 内置组件版本\n\n'
            printf '| 组件 | `latest` 全功能版 | `slim` 精简版 |\n'
            printf '| :--- | :--- | :--- |\n'
            printf '| HiFox CLI | `%s` | `%s` |\n' "${{ steps.versions.outputs.hifox }}" "${{ steps.versions.outputs.hifox }}"
            printf '| CC-Switch | `%s` | `-` |\n' "${{ steps.versions.outputs.cc_switch }}"
            printf '| Node.js / npm | `%s` / `%s` | `%s` / `%s` |\n' \
              "${{ steps.versions.outputs.node }}" "${{ steps.versions.outputs.npm }}" \
              "${{ steps.versions.outputs.node }}" "${{ steps.versions.outputs.npm }}"
            printf '| GitHub CLI (`gh`) | `%s` | `%s` |\n\n' "${{ steps.versions.outputs.gh }}" "${{ steps.versions.outputs.gh }}"
            printf '## 🐳 容器镜像（`linux/amd64`, `linux/arm64`）\n\n'
            printf -- '- **Docker Hub（主源）**: `%s:%s` · `%s:%s-slim`\n' "${DH_IMAGE}" "${TAG}" "${DH_IMAGE}" "${TAG}"
            printf -- '- **GHCR（备用源）**: `%s:%s` · `%s:%s-slim`\n' "${GHCR_IMAGE}" "${TAG}" "${GHCR_IMAGE}" "${TAG}"
          } > dist/release-notes.md

          if [ -n "${DRAFTER_ID:-}" ]; then
            jq -n \
              --arg tag "${TAG}" \
              --rawfile body dist/release-notes.md \
              '{tag_name: $tag, name: $tag, draft: false, body: $body}' \
              | gh api --method PATCH "repos/${{ github.repository }}/releases/${DRAFTER_ID}" --input - >/dev/null
          elif gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file dist/release-notes.md --draft=false
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file dist/release-notes.md
          fi

          gh release upload "${TAG}" \
            "dist/docker-compose.yml#docker-compose.yml" \
            "dist/.env.example#.env.example" \
            --clobber
