name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 新特性'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '🐛 问题修复'
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
  - title: '🧰 重构与优化'
    labels:
      - 'refactor'
      - 'perf'
  - title: '📝 文档更新'
    labels:
      - 'docs'
      - 'documentation'
  - title: '📦 构建与维护'
    labels:
      - 'build'
      - 'ci'
      - 'chore'
      - 'dependencies'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'feat'
      - 'feature'
      - 'minor'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'refactor'
      - 'perf'
      - 'docs'
      - 'build'
      - 'ci'
      - 'chore'
  default: patch

autolabeler:
  - label: 'feat'
    title:
      - '/^feat(\(.*\))?!?: /i'
    branch:
      - '/^feat\/.*/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?!?: /i'
    branch:
      - '/^fix\/.*/i'
  - label: 'refactor'
    title:
      - '/^(refactor|perf)(\(.*\))?!?: /i'
    branch:
      - '/^(refactor|perf)\/.*/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?!?: /i'
    branch:
      - '/^docs\/.*/i'
  - label: 'ci'
    title:
      - '/^(ci|build|chore)(\(.*\))?!?: /i'
    branch:
      - '/^(ci|build|chore)\/.*/i'
  - label: 'major'
    title:
      - '/^[a-z]+(\(.*\))?!: /i'

template: |
  ## 🚀 更新内容

  $CHANGES

  **完整变更记录**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
